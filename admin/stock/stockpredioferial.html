    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {   
            obtenerInsumos('Predio Ferial');
            obtenerPuntoDeControl('Predio Ferial')
            crearBotonCrearCategoria();

            const crearCategoriaBtn = document.querySelector(".registro-enlace")
            
            if(crearCategoriaBtn){
                crearCategoriaBtn.addEventListener("click",()=>{
                    crearCategoria()
                })
            }

            // Coordenadas del punto de "Predio Ferial"
            const lat = -28.445206739765315 // Ejemplo de latitud
            const lon = -65.75917235569783 // Ejemplo de longitud

            // Inicializar el mapa y centrarlo en Predio Ferial
            const map = L.map('map').setView([lat, lon], 14); // Nivel de zoom 14 para una vista detallada

            // Añadir el "tile layer" (mapa base)
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);

            // Añadir un marcador en las coordenadas de Predio Ferial
            L.marker([lat, lon]).addTo(map)
                .bindPopup("Punto Giro Predio Ferial")
                .openPopup();
        });
        
    </script>
